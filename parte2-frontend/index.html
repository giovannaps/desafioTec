<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner-DesafioTec</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container-banner">
        <div class="top-bar"></div>
        <div class="align">

            <div class="discourse">
                <img src="assets/discourse-logo.png" alt="Logo do Discourse">
            </div>

            <div class="title">
                <h2>Olá, <span id="username">User</span>!</h2>
                <h2>Seja bem-vindo(a) à plataforma!</h2>
            </div>

            <div class="paragraph">
                <p>Estamos felizes em ter você por aqui.</p>
            </div>
        </div>

        <button class="button">Conheça as regras da comunidade
            <img src="assets/arrow.png" alt="" class="arrow">
        </button>

    </div>
    <script src="../parte1-automacao/js/script.js"></script>
    <script>
        document.getElementById('username').textContent = User.username;
    </script>

</body>

</html>
